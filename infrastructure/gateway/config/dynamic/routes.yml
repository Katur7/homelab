http:
  routers:
    uptime:
      entryPoints:
        - websecure
      rule: "Host (`uptime.internal.pippinn.me`)"
      service: uptime
    pihole-on-pi:
      entryPoints:
        - websecure
      rule: "Host (`pihole-on-pi.internal.pippinn.me`)"
      service: pihole-on-pi
    monitoring:
      entryPoints:
        - websecure
      rule: "Host (`monitoring.internal.pippinn.me`)"
      service: monitoring
    t3:
      entryPoints:
        - websecure
      rule: "Host(`t3.internal.pippinn.me`)"
      middlewares:
        - internal-only@file
        - authelia-auth@file
      service: t3

  services:
    uptime:
      loadBalancer:
        servers:
          - url: "http://192.168.86.26:3001"
        passHostHeader: true
    pihole-on-pi:
      loadBalancer:
        servers:
          - url: "http://192.168.86.26"
        passHostHeader: true
    monitoring:
      loadBalancer:
        servers:
          - url: "http://192.168.86.26:8090"
        passHostHeader: true
    t3:
      loadBalancer:
        servers:
          - url: "http://172.17.0.1:3773"
        passHostHeader: true
