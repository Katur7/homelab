# SnapRAID Configuration for pippinn NAS
# Parity disk
parity /srv/parity1/snapraid.parity

# Content list files (1 on root SSD + 1 on each data disk)
content /var/snapraid.content
content /srv/disk1/.snapraid.content
content /srv/disk2/.snapraid.content
content /srv/disk3/.snapraid.content

# Data disks
data d1 /srv/disk1/
data d2 /srv/disk2/
data d3 /srv/disk3/

# Default excludes (retained from OMV array configuration)
exclude *.unrecoverable
exclude lost+found/
exclude aquota.user
exclude aquota.group
exclude /tmp/
exclude .content
exclude *.bak
exclude /snapraid.conf*
exclude /photos/thumbs/
exclude /code/
exclude /photos/encoded-video/
exclude /backup/borg/
exclude /backup/borg2/
exclude /backup/omv-backup/
exclude /syncthing/.stversions/
exclude *.!sync
exclude .DS_Store
exclude Thumbs.db

# Exclude transient download / torrent directories (prevent sync aborts on active downloads)
exclude /downloads-tv/
exclude /downloads-movies/
exclude /downloads-kids-movies/
