name: home-assistant

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.3
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    env_file:
      - ../../global.env
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    volumes:
      - ./config:/config
    labels:
      - "traefik.enable=true"
      # host.docker.internal required because HA uses network_mode:host — Traefik cannot
      # auto-discover the container IP on traefik_internal. host.docker.internal resolves
      # to 172.17.0.1 (docker bridge / host) via extra_hosts in the gateway compose.

      - "traefik.http.services.home-assistant.loadbalancer.server.url=http://host.docker.internal:8123"
      - "wud.tag.include=^\\d{4}\\.\\d+\\.\\d+$$"

      # Internal (LAN only — global internal-only middleware applies)
      - "traefik.http.routers.home-assistant-internal.entrypoints=websecure"
      - "traefik.http.routers.home-assistant-internal.rule=Host(`home-assistant.pippinn.me`)"

      # Tunnel (external — webhook path only, no Authelia)
      - "traefik.http.routers.home-assistant-tunnel.entrypoints=tunnel"
      - "traefik.http.routers.home-assistant-tunnel.rule=Host(`home-assistant.pippinn.me`) && PathPrefix(`/api/webhook/`)"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2048M

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:8.1.0
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./matter-server:/data
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  music-assistant-server:
    image: ghcr.io/music-assistant/server:2
    container_name: music-assistant-server
    # Network mode must be set to host for MA to discover and stream to players
    network_mode: host
    volumes:
      - ./music-assistant-server/data:/data/
    env_file:
      - ../../global.env
    labels:
      - "traefik.enable=true"
      # host.docker.internal required because MA uses network_mode:host — Traefik cannot
      # auto-discover the container IP on traefik_internal. host.docker.internal resolves
      # to 172.17.0.1 (docker bridge / host) via extra_hosts in the gateway compose.
      - "traefik.http.services.music-assistant.loadbalancer.server.url=http://host.docker.internal:8095"
      - "wud.tag.include=^\\d\\.\\d+\\.\\d+$$"

      # Internal (LAN only — global internal-only middleware applies)
      - "traefik.http.routers.music-assistant-internal.entrypoints=websecure"
      - "traefik.http.routers.music-assistant-internal.rule=Host(`music-assistant.internal.pippinn.me`)"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  ord_dagsins:
    image: katur/ord_dagsins
    container_name: ord_dagsins
    restart: unless-stopped
    networks:
      - traefik_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_internal"
      - "traefik.http.routers.ord-dagsins.entrypoints=websecure,tunnel"
      - "traefik.http.routers.ord-dagsins.rule=Host(`ord-dagsins.pippinn.me`)"
      - "wud.watch=false"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  traefik_internal:
    external: true
