# Package: Barnkanalen on Chromecast (SVT Play Integration)
# Turns on TV via HDMI-CEC and streams Barnkanalen dynamically using svt_play.
# See: services/home-assistant/specs/07-play-barnkanalen/plan.md

# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------

script:
  play_barnkanalen:
    alias: "Play Barnkanalen"
    description: "Turn on TV via HDMI-CEC and stream Barnkanalen on Chromecast"
    icon: mdi:television-play
    mode: single
    sequence:
      # 1. Wake Chromecast & trigger HDMI-CEC if device is off or in standby
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('media_player.living_room_tv_2') in ['off', 'standby'] }}"
            sequence:
              - action: media_player.turn_on
                target:
                  entity_id: media_player.living_room_tv_2
              - delay:
                  seconds: 2

      # 2. Play Barnkanalen via svt_play integration (dynamically resolves fresh stream URL)
      - action: svt_play.play_channel
        target:
          entity_id: media_player.living_room_tv_2
        data:
          channel: barnkanalen

  turn_off_tv:
    alias: "Turn Off TV"
    description: "Put Chromecast into standby / turn off TV via HDMI-CEC"
    icon: mdi:television-off
    mode: single
    sequence:
      - action: media_player.turn_off
        target:
          entity_id: media_player.living_room_tv_2
