# Package: Barnkanalen on Chromecast with Google TV
# Turns on TV via HDMI-CEC, handles SVT Play profile prompt, and launches SVT Barn live stream.
# See: services/home-assistant/specs/07-play-barnkanalen/plan.md

# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------

script:
  play_barnkanalen:
    alias: "Play Barnkanalen"
    description: "Turn on TV via HDMI-CEC, bypass profile screen, and tune to Barnkanalen in SVT Play"
    icon: mdi:television-play
    mode: single
    sequence:
      # 1. Wake Chromecast & trigger HDMI-CEC if device is off or in standby
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('remote.chromecast') in ['off', 'standby'] }}"
            sequence:
              - action: remote.turn_on
                target:
                  entity_id: remote.chromecast
              - delay:
                  seconds: 2

      # 2. Launch SVT Play app
      - action: remote.turn_on
        target:
          entity_id: remote.chromecast
        data:
          activity: "https://www.svtplay.se/kanaler/svtbarn"

      # 3. Wait for SVT Play profile selection screen to load
      - delay:
          seconds: 3

      # 4. Navigate down to "Titta utan profil" (Watch without profile) and select it
      - action: remote.send_command
        target:
          entity_id: remote.chromecast
        data:
          command: DPAD_DOWN
      - delay:
          milliseconds: 500
      - action: remote.send_command
        target:
          entity_id: remote.chromecast
        data:
          command: DPAD_CENTER

      # 5. Wait for guest session to initialize, then tune directly to Barnkanalen
      - delay:
          seconds: 2
      - action: remote.turn_on
        target:
          entity_id: remote.chromecast
        data:
          activity: "https://www.svtplay.se/kanaler/svtbarn"

  turn_off_tv:
    alias: "Turn Off TV"
    description: "Put Chromecast into standby / turn off TV via HDMI-CEC"
    icon: mdi:television-off
    mode: single
    sequence:
      - action: remote.turn_off
        target:
          entity_id: remote.chromecast
