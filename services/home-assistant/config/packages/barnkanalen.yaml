# Package: Barnkanalen on Chromecast with Google TV
# Turns on TV via HDMI-CEC, selects "Titta utan profil", and navigates to Barnkanalen.
# See: services/home-assistant/specs/07-play-barnkanalen/plan.md

# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------

script:
  play_barnkanalen:
    alias: "Play Barnkanalen"
    description: "Turn on TV via HDMI-CEC and navigate to Barnkanalen in SVT Play"
    icon: mdi:television-play
    mode: single
    sequence:
      # 1. Wake Chromecast & trigger HDMI-CEC if device is off or in standby
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('remote.chromecast') in ['off', 'standby'] }}"
            sequence:
              - action: remote.turn_on
                target:
                  entity_id: remote.chromecast
              - delay:
                  seconds: 2

      # 2. Launch SVT Play app
      - action: remote.turn_on
        target:
          entity_id: remote.chromecast
        data:
          activity: "https://www.svtplay.se"

      # 3. Wait for profile selection screen ("Vem tittar?") to render
      - delay:
          seconds: 4

      # 4. Navigate down to "Titta utan profil" and select it
      - action: remote.send_command
        target:
          entity_id: remote.chromecast
        data:
          command: DPAD_DOWN
      - delay:
          milliseconds: 500
      - action: remote.send_command
        target:
          entity_id: remote.chromecast
        data:
          command: DPAD_CENTER

      # 5. Wait for Home screen to load
      - delay:
          seconds: 3

      # 6. Open left sidebar menu
      - action: remote.send_command
        target:
          entity_id: remote.chromecast
        data:
          command: DPAD_LEFT
      - delay:
          milliseconds: 500

      # 7. Move down 4 times to "Kanaler"
      - repeat:
          count: 4
          sequence:
            - action: remote.send_command
              target:
                entity_id: remote.chromecast
              data:
                command: DPAD_DOWN
            - delay:
                milliseconds: 300

      # 8. Open "Kanaler" section
      - action: remote.send_command
        target:
          entity_id: remote.chromecast
        data:
          command: DPAD_CENTER
      - delay:
          seconds: 1.5

      # 9. Move right twice to highlight "Barnkanalen"
      - repeat:
          count: 2
          sequence:
            - action: remote.send_command
              target:
                entity_id: remote.chromecast
              data:
                command: DPAD_RIGHT
            - delay:
                milliseconds: 300

      # 10. Start playback of Barnkanalen
      - action: remote.send_command
        target:
          entity_id: remote.chromecast
        data:
          command: DPAD_CENTER

  turn_off_tv:
    alias: "Turn Off TV"
    description: "Put Chromecast into standby / turn off TV via HDMI-CEC"
    icon: mdi:television-off
    mode: single
    sequence:
      - action: remote.turn_off
        target:
          entity_id: remote.chromecast
