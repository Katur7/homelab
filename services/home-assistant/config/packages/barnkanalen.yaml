# Package: Barnkanalen on Chromecast
# Turns on TV via HDMI-CEC and streams Barnkanalen (SVT Barn) directly via Google Cast.
# See: services/home-assistant/specs/07-play-barnkanalen/plan.md

# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------

script:
  play_barnkanalen:
    alias: "Play Barnkanalen"
    description: "Turn on TV via HDMI-CEC and stream Barnkanalen on Chromecast"
    icon: mdi:television-play
    mode: single
    sequence:
      # 1. Wake Chromecast & trigger HDMI-CEC if device is off or in standby
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('media_player.chromecast') in ['off', 'standby'] }}"
            sequence:
              - action: media_player.turn_on
                target:
                  entity_id: media_player.chromecast
              - delay:
                  seconds: 2

      # 2. Cast Barnkanalen live DASH stream directly
      - action: media_player.play_media
        target:
          entity_id: media_player.chromecast
        data:
          media_content_id: "https://ed7.cdn.svt.se/l6/se/svtb/manifest.mpd?format=dash&defaultSubLang=1"
          media_content_type: "video/mp4"

  turn_off_tv:
    alias: "Turn Off TV"
    description: "Put Chromecast into standby / turn off TV via HDMI-CEC"
    icon: mdi:television-off
    mode: single
    sequence:
      - action: media_player.turn_off
        target:
          entity_id: media_player.chromecast
