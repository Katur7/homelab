# Package: Kids Bedroom Lighting & Morning Wake-Up
# Spec: services/home-assistant/specs/10-kids-bedroom-lights/plan.md

# ---------------------------------------------------------------------------
# Helpers
# ---------------------------------------------------------------------------

input_boolean:
  kids_bedroom_automations:
    name: "Kids Bedroom Automations"
    icon: mdi:bell-ring
    initial: true

# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------

script:
  kids_bedroom_morning_wakeup:
    alias: "Kids Bedroom: Morning Wake-Up"
    description: "Ramps light brightness from 1% to 100% (2700K) using native 15m transition and ramps music volume from 5% to 35%."
    icon: mdi:weather-sunset-up
    mode: restart
    sequence:
      # 1. Check master automation toggle
      - condition: state
        entity_id: input_boolean.kids_bedroom_automations
        state: "on"

      # 2. Set initial speaker volume low (5%)
      - action: media_player.volume_set
        target:
          entity_id: media_player.jukebox_jukebox
        data:
          volume_level: 0.05

      # 3. Start Music Assistant Playlist (Library ID 19)
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ 'music_assistant' in integration_entities('music_assistant') or true }}"
            sequence:
              - action: music_assistant.play_media
                target:
                  entity_id: media_player.jukebox_jukebox
                data:
                  media_type: playlist
                  media_id: "19"
        default:
          - action: media_player.play_media
            target:
              entity_id: media_player.jukebox_jukebox
            data:
              media_content_type: playlist
              media_content_id: "19"

      # 4. Turn on lights at minimum brightness (1%) and reset color temperature to 2700K
      - action: light.turn_on
        target:
          entity_id: light.kids_bedroom_lights
        data:
          brightness_pct: 1
          color_temp_kelvin: 2700

      # 5. Native 15-minute (900s) hardware transition to 100% brightness
      - action: light.turn_on
        target:
          entity_id: light.kids_bedroom_lights
        data:
          brightness_pct: 100
          transition: 900

      # 6. Volume ramp over 15 minutes (0.05 to 0.35)
      - repeat:
          count: 15
          sequence:
            - delay:
                seconds: 60

            # Abort ramp if master automation toggle was switched off
            - condition: state
              entity_id: input_boolean.kids_bedroom_automations
              state: "on"

            # Check if music is still playing; if stopped/paused manually, stop volume ramp
            - condition: template
              value_template: "{{ states('media_player.jukebox_jukebox') == 'playing' }}"

            # Step speaker volume (+0.02 per minute up to 0.35)
            - action: media_player.volume_set
              target:
                entity_id: media_player.jukebox_jukebox
              data:
                volume_level: "{{ [0.35, ((0.05 + (repeat.index * 0.02)) | round(2))] | min }}"

  kids_bedroom_stop_morning_routine:
    alias: "Kids Bedroom: Stop Routine & Turn Off"
    description: "Stops music playback and turns off the bedroom lights."
    icon: mdi:stop-circle-outline
    mode: single
    sequence:
      - action: script.turn_off
        target:
          entity_id: script.kids_bedroom_morning_wakeup
      - action: media_player.media_stop
        target:
          entity_id: media_player.jukebox_jukebox
      - action: light.turn_off
        target:
          entity_id: light.kids_bedroom_lights

# ---------------------------------------------------------------------------
# Automations
# ---------------------------------------------------------------------------

automation:
  # 1. Morning Wake-Up Trigger: Weekdays at 07:00
  - id: kids_bedroom_morning_wakeup_auto
    alias: "Kids Bedroom: Morning Wake-Up Routine"
    description: "Triggers the 15-minute fade-in light and music wake-up routine Monday to Friday at 07:00."
    triggers:
      - trigger: time
        at: "07:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.kids_bedroom_automations
        state: "on"
      - condition: time
        weekday:
          - mon
          - tue
          - wed
          - thu
          - fri
    actions:
      - action: script.kids_bedroom_morning_wakeup

  # 2. Out-of-Sync Wall Switch Toggle
  # Normally, Zigbee Direct Binding turns the lights ON when the rocker flips to ON,
  # and OFF when the rocker flips to OFF (even if HA is offline).
  # If the lights were changed from HA (putting the physical rocker out of sync with the lights),
  # flipping the rocker sends a command matching the state the lights are ALREADY in.
  # This automation detects that out-of-sync flip and toggles the lights immediately.
  - id: shelly_kids_out_of_sync_toggle
    alias: "Kids Bedroom: Wall Switch Out-of-Sync Toggle"
    description: "Toggles the lights if the physical rocker switch was out of sync with the current light state."
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: event
        event_type: zha_event
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.event.data.device_id == device_id('switch.shelly_1_kids')
             and (trigger.event.data.command | lower) in ['on', 'off']
             and states('light.kids_bedroom_lights') == (trigger.event.data.command | lower)
             and (now() - states.light.kids_bedroom_lights.last_changed).total_seconds() > 2 }}
    actions:
      - action: light.toggle
        target:
          entity_id: light.kids_bedroom_lights
