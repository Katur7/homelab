# Package: Kids Bedroom Lighting & Morning Wake-Up
# Spec: services/home-assistant/specs/10-kids-bedroom-lights/plan.md

# ---------------------------------------------------------------------------
# Helpers
# ---------------------------------------------------------------------------

input_boolean:
  kids_bedroom_automations:
    name: "Kids Bedroom Automations"
    icon: mdi:bell-ring
    initial: true

# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------

script:
  kids_bedroom_morning_wakeup:
    alias: "Kids Bedroom: Morning Wake-Up"
    description: "Ramps light brightness from 1% to 100% (2700K) using native 15m transition and ramps music volume from 5% to 35%."
    icon: mdi:weather-sunset-up
    mode: restart
    sequence:
      # 1. Check master automation toggle
      - condition: state
        entity_id: input_boolean.kids_bedroom_automations
        state: "on"

      # 2. Set initial speaker volume low (5%)
      - action: media_player.volume_set
        target:
          entity_id: media_player.jukebox_jukebox
        data:
          volume_level: 0.05

      # 3. Start Music Assistant Playlist (Library ID 19)
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ 'music_assistant' in integration_entities('music_assistant') or true }}"
            sequence:
              - action: music_assistant.play_media
                target:
                  entity_id: media_player.jukebox_jukebox
                data:
                  media_type: playlist
                  media_id: "19"
        default:
          - action: media_player.play_media
            target:
              entity_id: media_player.jukebox_jukebox
            data:
              media_content_type: playlist
              media_content_id: "19"

      # 4. Turn on lights at minimum brightness (1%) and reset color temperature to 2700K
      - action: light.turn_on
        target:
          entity_id: light.kids_bedroom_lights
        data:
          brightness_pct: 1
          color_temp_kelvin: 2700

      # 5. Native 15-minute (900s) hardware transition to 100% brightness
      - action: light.turn_on
        target:
          entity_id: light.kids_bedroom_lights
        data:
          brightness_pct: 100
          transition: 900

      # 6. Volume ramp over 15 minutes (0.05 to 0.35)
      - repeat:
          count: 15
          sequence:
            - delay:
                seconds: 60

            # Abort ramp if master automation toggle was switched off
            - condition: state
              entity_id: input_boolean.kids_bedroom_automations
              state: "on"

            # Check if music is still playing; if stopped/paused manually, stop volume ramp
            - condition: template
              value_template: "{{ states('media_player.jukebox_jukebox') == 'playing' }}"

            # Step speaker volume (+0.02 per minute up to 0.35)
            - action: media_player.volume_set
              target:
                entity_id: media_player.jukebox_jukebox
              data:
                volume_level: "{{ [0.35, ((0.05 + (repeat.index * 0.02)) | round(2))] | min }}"

  kids_bedroom_stop_morning_routine:
    alias: "Kids Bedroom: Stop Routine & Turn Off"
    description: "Stops music playback and turns off the bedroom lights."
    icon: mdi:stop-circle-outline
    mode: single
    sequence:
      - action: script.turn_off
        target:
          entity_id: script.kids_bedroom_morning_wakeup
      - action: media_player.media_stop
        target:
          entity_id: media_player.jukebox_jukebox
      - action: light.turn_off
        target:
          entity_id: light.kids_bedroom_lights

# ---------------------------------------------------------------------------
# Automations
# ---------------------------------------------------------------------------

automation:
  # 1. Morning Wake-Up Trigger: Weekdays at 07:00
  - id: kids_bedroom_morning_wakeup_auto
    alias: "Kids Bedroom: Morning Wake-Up Routine"
    description: "Triggers the 15-minute fade-in light and music wake-up routine Monday to Friday at 07:00."
    triggers:
      - trigger: time
        at: "07:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.kids_bedroom_automations
        state: "on"
      - condition: time
        weekday:
          - mon
          - tue
          - wed
          - thu
          - fri
    actions:
      - action: script.kids_bedroom_morning_wakeup

  # 2. Two-Way Sync between Shelly Input Switch and Kids Bedroom Lights
  - id: shelly_kids_input_light_sync
    alias: "Kids Bedroom: Sync Shelly Input Switch and Lights"
    description: "Keeps switch.shelly_1_kids_input and light.kids_bedroom_lights in two-way sync."
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: switch.shelly_1_kids_input
        from:
          - "on"
          - "off"
        to:
          - "on"
          - "off"
        id: input_changed
      - trigger: state
        entity_id: light.kids_bedroom_lights
        from:
          - "on"
          - "off"
        to:
          - "on"
          - "off"
        id: lights_changed
    actions:
      - choose:
          # When Shelly Input switch is toggled in HA
          - conditions:
              - condition: trigger
                id: input_changed
            sequence:
              # Brief delay so physical switch direct-binding updates the light first if flipped on wall
              - delay:
                  milliseconds: 250
              - condition: template
                value_template: "{{ states('light.kids_bedroom_lights') != trigger.to_state.state }}"
              - action: "light.turn_{{ trigger.to_state.state }}"
                target:
                  entity_id: light.kids_bedroom_lights

          # When Kids Bedroom Lights are turned on/off from HA UI or automations
          - conditions:
              - condition: trigger
                id: lights_changed
              - condition: template
                value_template: "{{ states('switch.shelly_1_kids_input') != trigger.to_state.state }}"
            sequence:
              - action: "switch.turn_{{ trigger.to_state.state }}"
                target:
                  entity_id: switch.shelly_1_kids_input
