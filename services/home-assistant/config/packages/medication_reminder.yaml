# Package: Medication Reminder
# Consolidated morning & evening medication tracking with shared NFC tag.
# See: services/home-assistant/specs/05-evening-medication-reminder/plan.md

# ---------------------------------------------------------------------------
# Helpers
# ---------------------------------------------------------------------------

input_datetime:
  medication_morning_last_taken:
    name: "Morning Medication Last Taken"
    has_date: true
    has_time: true
  medication_evening_last_taken:
    name: "Evening Medication Last Taken"
    has_date: true
    has_time: true

input_boolean:
  medication_morning_notified_today:
    name: "Morning Medication Notified Today"
  medication_morning_waiting_for_home:
    name: "Morning Medication Waiting for Home"
  medication_evening_notified_today:
    name: "Evening Medication Notified Today"

timer:
  medication_morning_snooze:
    name: "Morning Medication Snooze"
    duration: "00:30:00"
    restore: false
  medication_morning_notification_timeout:
    name: "Morning Medication Notification Timeout"
    duration: "01:00:00"
    restore: false
  medication_evening_snooze:
    name: "Evening Medication Snooze"
    duration: "00:30:00"
    restore: false
  medication_evening_notification_timeout:
    name: "Evening Medication Notification Timeout"
    duration: "01:00:00"
    restore: false

# ---------------------------------------------------------------------------
# Template sensors
# ---------------------------------------------------------------------------

template:
  - variables:
      phone_wifi_sensor: !secret phone_wifi_sensor
      home_wifi_ssid: !secret home_wifi_ssid
    binary_sensor:
      - name: "Phone at Home"
        unique_id: phone_at_home
        state: "{{ states(phone_wifi_sensor) == home_wifi_ssid }}"
        device_class: presence

# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------

script:
  # Mark taken for given period (morning | evening)
  medication_mark_taken:
    alias: "Medication: Mark Taken"
    fields:
      period:
        description: "morning or evening"
        default: "morning"
    sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: "input_datetime.medication_{{ period }}_last_taken"
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: timer.cancel
        target:
          entity_id:
            - "timer.medication_{{ period }}_snooze"
            - "timer.medication_{{ period }}_notification_timeout"
      - if:
          - condition: template
            value_template: "{{ period == 'morning' }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.medication_morning_waiting_for_home
      - action: input_boolean.turn_on
        target:
          entity_id: "input_boolean.medication_{{ period }}_notified_today"
      - action: !secret phone_notify_service
        data:
          message: clear_notification
          data:
            tag: "medication_{{ period }}_reminder"

  # Parameterised reminder sender
  medication_send_reminder:
    alias: "Medication: Send Reminder"
    fields:
      period:
        description: "morning or evening"
        default: "morning"
      message:
        description: "Notification body text"
      include_home_action:
        description: "Include the Remind me when home button"
        default: true
      final_reminder:
        description: "Final reminder — only show taken button"
        default: false
    sequence:
      - action: logbook.log
        data:
          name: "Medication {{ period | capitalize }}"
          message: "{{ period }} send_reminder called — message: {{ message }}"
          entity_id: "input_boolean.medication_{{ period }}_notified_today"
      - action: input_boolean.turn_on
        target:
          entity_id: "input_boolean.medication_{{ period }}_notified_today"
      # Start 1-hour timeout unless this is the final reminder
      - if:
          - condition: template
            value_template: "{{ not final_reminder }}"
        then:
          - action: timer.start
            target:
              entity_id: "timer.medication_{{ period }}_notification_timeout"
            data:
              duration: "01:00:00"
      - action: !secret phone_notify_service
        data:
          title: "{{ period | capitalize }} Medication Reminder"
          message: "{{ message | default('Have you taken your ' ~ period ~ ' medication?') }}"
          data:
            tag: "medication_{{ period }}_reminder"
            actions: >
              {% set p = period | upper %}
              {% if final_reminder %}
                {{ [{'action': 'MEDICATION_' ~ p ~ '_TAKEN', 'title': 'Taken'}] }}
              {% elif period == 'morning' and include_home_action %}
                {{ [
                  {'action': 'MEDICATION_' ~ p ~ '_TAKEN', 'title': 'Taken'},
                  {'action': 'MEDICATION_' ~ p ~ '_SNOOZE_30', 'title': 'Snooze 30m'},
                  {'action': 'MEDICATION_MORNING_REMIND_HOME', 'title': 'When home'}
                ] }}
              {% else %}
                {{ [
                  {'action': 'MEDICATION_' ~ p ~ '_TAKEN', 'title': 'Taken'},
                  {'action': 'MEDICATION_' ~ p ~ '_SNOOZE_30', 'title': 'Snooze 30m'}
                ] }}
              {% endif %}

  # Reset all helpers to epoch 2000-01-01 for test suite
  medication_reset_test_state:
    alias: "Medication: Reset Test State"
    sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id:
            - input_datetime.medication_morning_last_taken
            - input_datetime.medication_evening_last_taken
        data:
          datetime: "2000-01-01 00:00:00"
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.medication_morning_notified_today
            - input_boolean.medication_morning_waiting_for_home
            - input_boolean.medication_evening_notified_today
      - action: timer.cancel
        target:
          entity_id:
            - timer.medication_morning_snooze
            - timer.medication_morning_notification_timeout
            - timer.medication_evening_snooze
            - timer.medication_evening_notification_timeout

# ---------------------------------------------------------------------------
# Automations
# ---------------------------------------------------------------------------

automation:
  # 1. Off-charger morning window: start 30-min snooze timer
  - id: medication_morning_off_charger
    alias: medication_morning_off_charger
    triggers:
      - trigger: state
        entity_id: !secret phone_charging_sensor
        to: "discharging"
    conditions:
      - condition: time
        after: "05:00:00"
        before: "09:30:00"
      - condition: template
        value_template: >
          {{ states('input_datetime.medication_morning_last_taken')[:10] != now().strftime('%Y-%m-%d') }}
      - condition: state
        entity_id: timer.medication_morning_snooze
        state: idle
    actions:
      - action: timer.start
        target:
          entity_id: timer.medication_morning_snooze
        data:
          duration: "00:30:00"

  # 2. Snooze timer done: send reminder for active period
  - id: medication_timer_done
    alias: medication_timer_done
    variables:
      period: "{{ 'morning' if 'morning' in trigger.event.data.entity_id else 'evening' }}"
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.medication_morning_snooze
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.medication_evening_snooze
    conditions:
      - condition: template
        value_template: >
          {{ states('input_datetime.medication_' ~ period ~ '_last_taken')[:10] != now().strftime('%Y-%m-%d') }}
    actions:
      - action: script.medication_send_reminder
        data:
          period: "{{ period }}"
          message: "Have you taken your {{ period }} medication?"

  # 3. Scheduled cron reminders (10:00 morning, 22:00 evening)
  - id: medication_scheduled_reminder
    alias: medication_scheduled_reminder
    triggers:
      - trigger: time
        at: "10:00:00"
        id: morning
      - trigger: time
        at: "22:00:00"
        id: evening
    conditions:
      - condition: template
        value_template: >
          {{ states('input_datetime.medication_' ~ trigger.id ~ '_last_taken')[:10] != now().strftime('%Y-%m-%d') }}
      - condition: template
        value_template: >
          {{ trigger.id == 'evening' or (
             states('input_boolean.medication_morning_notified_today') == 'off' and
             states('timer.medication_morning_snooze') == 'idle') }}
    actions:
      - action: script.medication_send_reminder
        data:
          period: "{{ trigger.id }}"
          message: >
            {{ "Don't forget your morning medication!" if trigger.id == 'morning' else "Have you taken your evening medication?" }}

  # 4. NFC scan: route to morning (<20:00) or evening (>=20:00)
  - id: medication_nfc_scanned
    alias: medication_nfc_scanned
    variables:
      allowed_device_id: !secret phone_device_id
    triggers:
      - trigger: event
        event_type: tag_scanned
        event_data:
          tag_id: !secret medication_nfc_tag_id
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.device_id == allowed_device_id }}"
    actions:
      - action: script.medication_mark_taken
        data:
          period: "{{ 'morning' if now().hour < 20 else 'evening' }}"

  # 5. Notification action: Taken
  - id: medication_action_taken
    alias: medication_action_taken
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
    conditions:
      - condition: template
        value_template: >
          {{ trigger.event.data.action in ['MEDICATION_TAKEN', 'MEDICATION_MORNING_TAKEN', 'MEDICATION_EVENING_TAKEN'] }}
    actions:
      - action: script.medication_mark_taken
        data:
          period: "{{ 'evening' if 'EVENING' in trigger.event.data.action else 'morning' }}"

  # 6. Notification action: Snooze 30 min
  - id: medication_action_snooze
    alias: medication_action_snooze
    variables:
      period: "{{ 'evening' if 'EVENING' in trigger.event.data.action else 'morning' }}"
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
    conditions:
      - condition: template
        value_template: >
          {{ trigger.event.data.action in ['MEDICATION_SNOOZE_30', 'MEDICATION_MORNING_SNOOZE_30', 'MEDICATION_EVENING_SNOOZE_30'] }}
      - condition: template
        value_template: >
          {{ states('input_datetime.medication_' ~ period ~ '_last_taken')[:10] != now().strftime('%Y-%m-%d') }}
    actions:
      - action: timer.cancel
        target:
          entity_id: "timer.medication_{{ period }}_notification_timeout"
      - action: timer.cancel
        target:
          entity_id: "timer.medication_{{ period }}_snooze"
      - action: timer.start
        target:
          entity_id: "timer.medication_{{ period }}_snooze"
        data:
          duration: "00:30:00"

  # 7. Notification action: Remind when home (morning only)
  - id: medication_morning_action_home
    alias: medication_morning_action_home
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
    conditions:
      - condition: template
        value_template: >
          {{ trigger.event.data.action in ['MEDICATION_REMIND_HOME', 'MEDICATION_MORNING_REMIND_HOME'] }}
      - condition: template
        value_template: >
          {{ states('input_datetime.medication_morning_last_taken')[:10] != now().strftime('%Y-%m-%d') }}
    actions:
      - action: timer.cancel
        target:
          entity_id: timer.medication_morning_notification_timeout
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.medication_morning_waiting_for_home
      # If already home, send immediately and clear waiting flag
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.phone_at_home
                state: "on"
            sequence:
              - action: script.medication_send_reminder
                data:
                  period: morning
                  message: "You're already home — have you taken your morning medication?"
                  include_home_action: false
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.medication_morning_waiting_for_home

  # 8. Arrived home while waiting (morning only)
  - id: medication_morning_arrived_home
    alias: medication_morning_arrived_home
    triggers:
      - trigger: state
        entity_id: binary_sensor.phone_at_home
        to: "on"
        for:
          minutes: 2
    conditions:
      - condition: state
        entity_id: input_boolean.medication_morning_waiting_for_home
        state: "on"
      - condition: template
        value_template: >
          {{ states('input_datetime.medication_morning_last_taken')[:10] != now().strftime('%Y-%m-%d') }}
    actions:
      - action: script.medication_send_reminder
        data:
          period: morning
          message: "Welcome home! Have you taken your morning medication?"
          include_home_action: false
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.medication_morning_waiting_for_home

  # 9. Hard fallbacks (17:00 morning, 23:30 evening)
  - id: medication_hard_fallback
    alias: medication_hard_fallback
    triggers:
      - trigger: time
        at: "17:00:00"
        id: morning
      - trigger: time
        at: "23:30:00"
        id: evening
    conditions:
      - condition: template
        value_template: >
          {{ states('input_datetime.medication_' ~ trigger.id ~ '_last_taken')[:10] != now().strftime('%Y-%m-%d') }}
    actions:
      - action: timer.cancel
        target:
          entity_id:
            - "timer.medication_{{ trigger.id }}_snooze"
            - "timer.medication_{{ trigger.id }}_notification_timeout"
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'morning' }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.medication_morning_waiting_for_home
      - action: script.medication_send_reminder
        data:
          period: "{{ trigger.id }}"
          message: "Last reminder for {{ 'today' if trigger.id == 'morning' else 'tonight' }} — have you taken your {{ trigger.id }} medication?"
          include_home_action: false
          final_reminder: true

  # 10. Notification timeout: re-notify hourly if dismissed
  - id: medication_notification_timeout
    alias: medication_notification_timeout
    variables:
      period: "{{ 'morning' if 'morning' in trigger.event.data.entity_id else 'evening' }}"
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.medication_morning_notification_timeout
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.medication_evening_notification_timeout
    conditions:
      - condition: template
        value_template: >
          {{ states('input_datetime.medication_' ~ period ~ '_last_taken')[:10] != now().strftime('%Y-%m-%d') }}
      - condition: template
        value_template: >
          {{ (period == 'morning' and now().hour < 17) or
             (period == 'evening' and (now().hour >= 20 and (now().hour < 23 or (now().hour == 23 and now().minute < 30)))) }}
    actions:
      - action: script.medication_send_reminder
        data:
          period: "{{ period }}"
          message: "Reminder: have you taken your {{ period }} medication?"

  # 11. Startup check — catches HA being down at trigger times
  - id: medication_startup_check
    alias: medication_startup_check
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - if:
          - condition: time
            after: "10:00:00"
            before: "17:00:00"
          - condition: template
            value_template: >
              {{ states('input_datetime.medication_morning_last_taken')[:10] != now().strftime('%Y-%m-%d') }}
          - condition: state
            entity_id: input_boolean.medication_morning_notified_today
            state: "off"
        then:
          - action: script.medication_send_reminder
            data:
              period: morning
              message: "Don't forget your morning medication!"
              include_home_action: false
      - if:
          - condition: time
            after: "22:00:00"
            before: "23:30:00"
          - condition: template
            value_template: >
              {{ states('input_datetime.medication_evening_last_taken')[:10] != now().strftime('%Y-%m-%d') }}
          - condition: state
            entity_id: input_boolean.medication_evening_notified_today
            state: "off"
        then:
          - action: script.medication_send_reminder
            data:
              period: evening
              message: "Don't forget your evening medication!"

  # 12. Midnight reset — clears flags and timers
  - id: medication_daily_reset
    alias: medication_daily_reset
    triggers:
      - trigger: time
        at: "00:00:00"
    actions:
      - action: timer.cancel
        target:
          entity_id:
            - timer.medication_morning_snooze
            - timer.medication_morning_notification_timeout
            - timer.medication_evening_snooze
            - timer.medication_evening_notification_timeout
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.medication_morning_waiting_for_home
            - input_boolean.medication_morning_notified_today
            - input_boolean.medication_evening_notified_today
