name: syncthing

services:
  syncthing:
    image: ghcr.io/linuxserver/syncthing:v2.1.5-ls229
    container_name: syncthing
    restart: unless-stopped
    networks:
      - traefik_internal
    env_file:
      - ../../global.env
    ports:
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - ./config:/config
      - /mnt/storage/syncthing:/syncthing
      - /mnt/storage/code:/code
      - /mnt/storage/backup:/backup
      - /mnt/storage/books:/books
      - /mnt/storage/kids:/kids
      - /mnt/storage/movies:/movies
      - /mnt/storage/tv:/tv
      - /mnt/storage/MyndirHirslur:/MyndirHirslur
    labels:
      - "wud.autoupdate=true"
      - "traefik.enable=true"
      - "traefik.http.routers.sync-internal.entrypoints=websecure"
      - "traefik.http.routers.sync-internal.rule=Host(`sync.internal.pippinn.me`)"
      - "traefik.http.services.sync.loadbalancer.server.port=8384"
      - "wud.tag.include=^v\\d+\\.\\d+\\.\\d+-ls\\d+$$"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

networks:
  traefik_internal:
    external: true
